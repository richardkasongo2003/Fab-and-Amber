<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#170d16">
  <title>The Amber &amp; Fabian Archives</title>
  <meta name="description" content="Nine memories. One very special surprise.">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#170d16;color:#fff8f1;font-family:Arial,sans-serif}button{font:inherit}.app{position:relative;min-height:100vh;overflow:hidden}.glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.42;pointer-events:none}.g1{width:46rem;height:46rem;right:-14rem;top:-17rem;background:#a81f4b}.g2{width:36rem;height:36rem;left:-18rem;bottom:-22rem;background:#593457}.grain{position:fixed;inset:0;pointer-events:none;opacity:.17;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}.nav{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:22px 5vw}.brand{display:flex;align-items:center;gap:12px;background:0;border:0;color:#ffe4ebb8;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;cursor:pointer}.logo{display:grid;place-items:center;width:34px;height:34px;border:1px solid #ffd6e133;border-radius:50%;background:#fff1;font-size:11px;letter-spacing:0}.pill{border:1px solid #fff2;border-radius:99px;background:#fff1;padding:8px 12px;color:#ffffff88;font-size:9px;text-transform:uppercase;letter-spacing:.18em}.screen{position:relative;z-index:2;max-width:1160px;min-height:calc(100vh - 80px);margin:auto;padding:4vh 5vw 10vh;display:flex;align-items:center}.welcome-grid{width:100%;display:grid;grid-template-columns:1.15fr .85fr;gap:5vw;align-items:end}.eyebrow{color:#f7a5b8;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.32em}.display{font-family:Georgia,serif;font-weight:400}.hero{margin:20px 0 0;font:400 clamp(4rem,10vw,8.4rem)/.78 Georgia,serif;letter-spacing:-.065em}.hero em,.pink{color:#ffcad6;font-weight:400}.copy{max-width:570px;margin:30px 0 0;color:#ffeef299;font-size:clamp(16px,2vw,18px);line-height:1.7}.primary,.next{border:0;border-radius:99px;background:#fff6ee;color:#331520;font-weight:800;cursor:pointer;transition:.2s}.primary{margin-top:34px;padding:16px 22px;display:inline-flex;gap:26px}.primary:hover,.next:hover{transform:translateY(-2px);box-shadow:0 12px 35px #ef6c8e3d}.case{min-height:440px;padding:32px;border:1px solid #fff2;border-radius:32px;background:linear-gradient(145deg,#fff1,#fff0);display:flex;flex-direction:column;justify-content:space-between;transform:rotate(2deg);box-shadow:0 30px 100px #0004}.case-num{align-self:flex-end;font:italic 6rem/.8 Georgia;color:#ffcad62e}.case h2{font:400 3rem/1 Georgia;margin:12px 0}.quiz{width:100%;max-width:760px;margin:auto}.topline{display:flex;justify-content:space-between;margin-bottom:18px;color:#ffeef26e;font-size:10px;letter-spacing:.23em;text-transform:uppercase}.track{height:2px;background:#fff2}.bar{height:100%;background:linear-gradient(90deg,#d35476,#ffbacb);transition:.5s}.card{position:relative;overflow:hidden;margin-top:24px;padding:clamp(24px,5vw,54px);border:1px solid #fff2;border-radius:32px;background:linear-gradient(145deg,#fff1,#ffffff08);box-shadow:0 30px 100px #0004}.ghost{position:absolute;right:20px;top:6px;font:italic clamp(4rem,10vw,7rem)/1 Georgia;color:#ffcad614}.question{position:relative;margin:16px 0 0;font:400 clamp(2.15rem,6vw,4rem)/1.04 Georgia;letter-spacing:-.035em}.options{position:relative;margin-top:32px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{position:relative;display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 44px 10px 10px;border:1px solid #fff2;border-radius:16px;background:#0002;color:#ffffffc7;text-align:left;cursor:pointer;transition:.2s}.option:hover{transform:translateY(-1px);border-color:#f7a5b873;background:#fff1}.letter{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:10px;background:#fff1;color:#f7a5b8;font-size:11px;font-weight:800}.option.good{border-color:#f7a5b899;background:#d04e6f33;color:#fff}.option.bad{background:#0004}.check{position:absolute;right:16px}.message{min-height:64px;padding-top:18px;color:#ffffff55;font-size:13px}.message.correct{display:flex;align-items:center;justify-content:space-between;gap:14px;color:#ffd7e0;font-weight:700}.message.wrong{color:#ffc1ce;font-weight:700}.next{padding:12px 16px;white-space:nowrap}.center{width:100%;text-align:center;display:flex;flex-direction:column;align-items:center}.seal{display:grid;place-items:center;width:80px;height:80px;border:1px solid #ffcad659;border-radius:50%;background:#fff1;color:#ffcad6;font:2rem Georgia}.final-title{margin:20px 0 0;font:400 clamp(3.7rem,9vw,7.5rem)/.88 Georgia;letter-spacing:-.06em}.reveal{width:100%;display:grid;grid-template-columns:.9fr 1.1fr;gap:5vw;align-items:center}.reveal h1{margin:14px 0 0;font:400 clamp(4.5rem,10vw,8rem)/.82 Georgia;letter-spacing:-.065em}.media{position:relative;min-height:500px}.video{width:84%;max-height:620px;border:1px solid #fff2;border-radius:28px;background:#080508;object-fit:contain;box-shadow:0 35px 100px #0007}.photo{position:absolute;right:0;bottom:0;width:41%;aspect-ratio:4/3;overflow:hidden;border:8px solid #f5eee8;border-bottom-width:34px;background:#eee;transform:rotate(4deg);box-shadow:0 20px 60px #0007}.photo img{width:100%;height:100%;object-fit:contain;background:#ece7df}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-20px;width:8px;height:15px;animation:fall 3.8s ease-in infinite}.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1)}.shake{animation:shake .42s}.hidden{display:none!important}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}@keyframes fall{to{transform:translateY(110vh) rotate(650deg)}}
    @media(max-width:760px){.case{display:none}.welcome-grid,.reveal{grid-template-columns:1fr}.options{grid-template-columns:1fr}.screen{padding-top:3vh}.media{min-height:440px}.video{width:94%}.photo{width:44%}.message.correct{align-items:flex-start;flex-direction:column}.pill{letter-spacing:.1em}.brand{letter-spacing:.16em}.reveal{padding-top:30px}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body><main class="app"><div class="glow g1"></div><div class="glow g2"></div><div class="grain"></div><nav class="nav"><button class="brand" onclick="welcome()"><span class="logo">A+F</span>Private archive</button><span class="pill" id="pill">Est. forever</span></nav><section class="screen" id="screen"></section></main>
<script>
const questions=[
['The beginning','Origin story','How did Amber and Fabian first meet?',['At church','Through mutual friends','At a party','On an app'],0,'Not quite—that would be a different meet-cute. Try again!'],
['First impressions','She noticed','What was the first thing Amber noticed about Fabian?',['His smile','His kindness','His sense of humor','His style'],2,'A good guess… but Amber remembers it differently 😂'],
['Date number one','Where it began','Where did Amber and Fabian go on their very first date?',['Coffee shop','Bowling Alley','Movie theater','Ice cream + walk'],1,'Cute idea, wrong memory. Take another swing!'],
['The big yes','Officially official','What year did Amber and Fabian get married?',['2018','2019','2015','2013'],2,'Careful—this one belongs in the family history books!'],
['Opposites attract','Fabian’s favorite','Which of these is something Fabian LOVES that Amber does not?',['Loose-leaf tea','Salads','Chinese entertainment','Spicy food'],2,'Nope! Apparently love does have its limits 😄'],
['Bukata files','Current obsession','What is Bukata’s obsession right now?',['Animals','Pretend cooking','Pouring activities','Books'],3,'A reasonable guess, but the tiny expert says otherwise!'],
['Adulting unlocked','A major milestone','Which milestone made Amber and Fabian feel like “real adults”?',['Surviving sleep training','First family vacation','Setting up baby gates','Buying a second stroller'],2,'Not the moment that made it official—try again!'],
['A very special day','Never forget','What is their daughter’s birthday?',['October 15','November 1','December 3','September 28'],1,'Ooooh, so close to being in trouble 😂 Try again!'],
['Family favorites','Perfect weekend','Which weekend activity is the family’s favorite way to spend time together?',['Park playtime','Coffee + pastries outing','Visiting animals','Backyard painting and crafts'],0,'That sounds fun—but it isn’t the family favorite!']];
let index=0,locked=false;const screen=document.querySelector('#screen'),pill=document.querySelector('#pill');
function welcome(){pill.textContent='Est. forever';screen.innerHTML=`<div class="welcome-grid rise"><div><p class="eyebrow">For one very important person</p><h1 class="hero">The Amber<br><em>&amp; Fabian</em><br>Archives</h1><p class="copy">Every love story leaves clues. Remember nine moments, unlock every chapter, and discover what’s waiting at the end.</p><button class="primary" onclick="start()">Begin the story <span>→</span></button></div><div class="case"><span class="case-num">09</span><div><p class="eyebrow">Case file</p><h2>One more<br>chapter</h2></div><div>Authorized access requires an excellent memory.　♡</div></div></div>`}
function start(){index=0;renderQuestion()}
function renderQuestion(){locked=false;let q=questions[index];pill.textContent=`${index+1} of 9 unlocked`;screen.innerHTML=`<div class="quiz rise"><div class="topline"><span>Chapter ${String(index+1).padStart(2,'0')} · ${q[0]}</span><span>${Math.round((index+1)/9*100)}%</span></div><div class="track"><div class="bar" style="width:${(index+1)/9*100}%"></div></div><div class="card" id="card"><span class="ghost">${String(index+1).padStart(2,'0')}</span><p class="eyebrow">${q[1]}</p><h2 class="question">${q[2]}</h2><div class="options">${q[3].map((o,i)=>`<button class="option" onclick="choose(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}</div><div class="message" id="message">Choose wisely. Unlimited guesses are allowed.</div></div></div>`}
function choose(i){if(locked)return;let q=questions[index],opts=[...document.querySelectorAll('.option')],msg=document.querySelector('#message'),card=document.querySelector('#card');opts.forEach(x=>x.classList.remove('bad'));if(i===q[4]){locked=true;opts[i].classList.add('good');opts[i].insertAdjacentHTML('beforeend','<b class="check">✓</b>');msg.className='message correct';msg.innerHTML=`<span>✓ Correct—chapter unlocked!</span><button class="next" onclick="next()">${index===8?'Open final archive':'Next chapter'} →</button>`}else{opts[i].classList.add('bad');msg.className='message wrong';msg.textContent='✕ '+q[5];card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake')}}
function next(){if(index<8){index++;renderQuestion()}else finalGate()}
function finalGate(){pill.textContent='Archive complete';screen.innerHTML=`<div class="center rise"><div class="seal">♡</div><p class="eyebrow" style="margin-top:28px">Archive complete</p><h1 class="final-title">You unlocked<br><em class="pink">one more chapter.</em></h1><p class="copy">Some stories don’t end. They make room for something beautifully new.</p><button class="primary" onclick="reveal()">Reveal the surprise <span>♡</span></button></div>`}
function reveal(){pill.textContent='Our family is growing';screen.innerHTML=`<div class="reveal rise"><div><p class="eyebrow">Our family is growing</p><h1>Baby<br><em class="pink">on board.</em></h1><p class="copy">The next chapter of the Amber &amp; Fabian story is already being written. We can’t wait to meet you, little one. ♡</p></div><div class="media"><video class="video" src="reveal.mp4" controls autoplay playsinline></video><div class="photo"><img src="ultrasound.jpg" alt="Ultrasound photograph revealing the new baby"></div></div><div class="confetti">${Array.from({length:30},(_,i)=>`<i style="left:${i*37%100}%;animation-delay:${i%8*.08}s;background:${['#f58ca5','#ffcad6','#fff1cf','#ca9ce1'][i%4]}"></i>`).join('')}</div></div>`}
welcome();
</script></body></html>
